name: CI

# Pushes to main run this workflow through release.yml (which publishes the edge image only when
# it passes), so main is not checked twice.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Bundle budget
        run: npm run check:bundle

  e2e:
    name: End-to-end tests (mock server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image (build and runtime tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: jellymorph:ci
          cache-from: type=gha
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Container tests (read-only, proxy, CSP with the full E2E suite)
        run: node scripts/test-container.ts jellymorph:ci --e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-container
          path: |
            playwright-report
            test-results
          retention-days: 7
