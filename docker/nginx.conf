# Main nginx configuration of the Jellymorph image (docs/architecture.md §15).
# Everything nginx writes lives in /tmp, so the container runs with a read-only root filesystem.
# The site itself is rendered at startup by the entrypoint into /tmp/jellymorph/site.conf.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
        application/manifest+json image/svg+xml text/plain;

    include /tmp/jellymorph/site.conf;
}
